/**
 * nginx.conf - Configuración de Nginx para SpiritechFactu en producción
 *
 * INSTALACIÓN Y CONFIGURACIÓN EN VPS IONOS:
 *
 * 1. Instalar Nginx:
 *    sudo apt-get update
 *    sudo apt-get install -y nginx
 *
 * 2. Copiar este archivo:
 *    sudo cp config/nginx.conf /etc/nginx/sites-available/spiritechfactu
 *    sudo ln -s /etc/nginx/sites-available/spiritechfactu /etc/nginx/sites-enabled/
 *
 * 3. Eliminar configuración por defecto (opcional):
 *    sudo rm /etc/nginx/sites-enabled/default
 *
 * 4. Verificar sintaxis:
 *    sudo nginx -t
 *
 * 5. Recargar Nginx:
 *    sudo systemctl reload nginx
 *
 * 6. SSL con Let's Encrypt:
 *    sudo apt-get install -y certbot python3-certbot-nginx
 *    sudo certbot certonly --nginx -d tu-dominio.com -d www.tu-dominio.com
 *
 * CARACTERÍSTICAS:
 * ✅ Servir React SPA en puerto 80/443
 * ✅ Reverse proxy para API en puerto 3000
 * ✅ Compresión GZIP
 * ✅ Cache de archivos estáticos
 * ✅ Fallback SPA (cualquier ruta → index.html)
 * ✅ SSL/TLS con Let's Encrypt
 * ✅ Seguridad (headers de seguridad)
 */

# Bloque upstream para el backend Node.js
upstream backend {
    # Servidor backend en localhost:3000
    server localhost:3000;

    # Keepalive para mejor rendimiento
    keepalive 32;
}

# Redirigir HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com www.tu-dominio.com;

    # Ruta para renovación automática de certificado
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu-dominio.com www.tu-dominio.com;

    # ========================================================================
    # SSL/TLS - Let's Encrypt
    # ========================================================================
    # TODO: Reemplazar con tus rutas de certificado
    # Generado con: sudo certbot certonly --nginx -d tu-dominio.com
    ssl_certificate /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;

    # Configuración SSL segura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ========================================================================
    # Seguridad - Headers
    # ========================================================================
    # Prevenir clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevenir MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Habilitar XSS protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Política de contenido
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

    # ========================================================================
    # Configuración general
    # ========================================================================
    root /var/www/spiritechfactu/frontend/dist;
    index index.html;

    # Charset
    charset utf-8;

    # Tamaño máximo de request body (para upload de PDFs, etc)
    client_max_body_size 10M;

    # ========================================================================
    # COMPRESIÓN GZIP
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # ========================================================================
    # API BACKEND - Reverse Proxy al servidor Node.js
    # ========================================================================
    location /api/ {
        # Redirigir a upstream backend
        proxy_pass http://backend;

        # Headers para comunicación correcta
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ========================================================================
    # STATIC FILES - Caching
    # ========================================================================
    # Cache de assets (JS, CSS, imágenes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Cache por 1 año para assets versionados
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML no cachear
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # ========================================================================
    # SPA FALLBACK
    # ========================================================================
    # Cualquier ruta no existente → index.html (para React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========================================================================
    # HEALTH CHECK
    # ========================================================================
    location /health {
        proxy_pass http://backend;
        access_log off;
    }

    # ========================================================================
    # LOGS
    # ========================================================================
    access_log /var/log/nginx/spiritechfactu-access.log combined;
    error_log /var/log/nginx/spiritechfactu-error.log warn;
}

# Redirigir www a no-www (opcional)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tu-dominio.com;

    ssl_certificate /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;

    return 301 https://tu-dominio.com$request_uri;
}
