name: ClaudeWeb
description: Interfaz web moderna para interactuar con Claude AI de Anthropic
services:
  - type: app
    data:
      projectName: claudeweb
      serviceName: claudeweb-backend
      source:
        type: image
        image: node:18-alpine
      build:
        type: dockerfile
        dockerfile: |
          FROM node:18-alpine

          WORKDIR /app

          # Copiar archivos de package
          COPY backend/package*.json ./

          # Instalar dependencias
          RUN npm ci --only=production

          # Copiar código
          COPY backend/ .

          # Exponer puerto
          EXPOSE 3001

          # Healthcheck
          HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
            CMD node -e "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"

          # Comando de inicio
          CMD ["node", "server.js"]
      env:
        - key: PORT
          value: "3001"
        - key: NODE_ENV
          value: production
      domains:
        - host: $(EASYPANEL_DOMAIN)
          port: 3001
          path: /api
      mounts: []
      deploy:
        replicas: 1
        restartPolicy: unless-stopped
        zeroDowntime: true

  - type: app
    data:
      projectName: claudeweb
      serviceName: claudeweb-frontend
      source:
        type: image
        image: nginx:alpine
      build:
        type: dockerfile
        dockerfile: |
          FROM node:18-alpine AS builder

          WORKDIR /app

          # Copiar archivos de package
          COPY frontend/package*.json ./

          # Instalar dependencias
          RUN npm ci

          # Copiar código
          COPY frontend/ .

          # Build arg para URL del backend
          ARG VITE_API_URL
          ENV VITE_API_URL=$VITE_API_URL

          # Build
          RUN npm run build

          # Stage 2: Nginx para servir
          FROM nginx:alpine

          # Copiar build
          COPY --from=builder /app/dist /usr/share/nginx/html

          # Copiar configuración de nginx
          COPY frontend/nginx.conf /etc/nginx/conf.d/default.conf

          EXPOSE 80

          CMD ["nginx", "-g", "daemon off;"]
      env:
        - key: VITE_API_URL
          value: https://$(EASYPANEL_DOMAIN)/api
      domains:
        - host: $(EASYPANEL_DOMAIN)
          port: 80
      mounts: []
      deploy:
        replicas: 1
        restartPolicy: unless-stopped
        dependsOn:
          - claudeweb-backend
