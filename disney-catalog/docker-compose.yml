version: '3.8'

services:
  disney-catalog:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: disney100-britto-catalog

    image: disney-catalog:latest

    ports:
      - "8080:80"

    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

    restart: unless-stopped

    networks:
      - disney-network

    labels:
      - "com.disney.project=Disney100 x Britto Catalog"
      - "com.disney.version=1.0.0"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  disney-network:
    driver: bridge

# ============================================
# COMANDOS ÚTILES
# ============================================
#
# Construir y levantar:
#   docker-compose up -d --build
#
# Ver logs:
#   docker-compose logs -f
#
# Detener:
#   docker-compose down
#
# Reconstruir sin cache:
#   docker-compose build --no-cache
#
# Ver estado:
#   docker-compose ps
#
# Acceder al contenedor:
#   docker-compose exec disney-catalog sh
#
# ============================================
